services:
  - type: web
    name: rezervo-api
    runtime: docker
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        sync: false
      - key: WEB_ORIGIN
        sync: false
      - key: API_PUBLIC_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false
      - key: EMAIL_PROVIDER
        value: none
      - key: PAYMENT_PROVIDER
        value: none
      - key: STORAGE_PROVIDER
        value: local
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: SEED_DEMO_DATA
        value: false
