services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rezervo
      POSTGRES_USER: rezervo
      POSTGRES_PASSWORD: rezervo
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rezervo -d rezervo']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
